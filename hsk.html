<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mini-Dicto | HSK</title>


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            font-family:
                "Noto Sans Thai",
                "Noto Sans",
                Arial,
                sans-serif;

            background: #f9f8ff;

            color: #4d4d4d;

            min-height: 100vh;

        }


        a {
            text-decoration: none;
            color: inherit;
        }


        button,
        input {
            font-family: inherit;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            width: 100%;

            background:
                rgba(255, 255, 255, 0.96);

            border-bottom:
                1px solid #eeeafa;

            position: sticky;

            top: 0;

            z-index: 100;

            backdrop-filter:
                blur(10px);

        }


        .nav-container {

            max-width: 1100px;

            min-height: 70px;

            margin: auto;

            padding:
                12px 24px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

        }


        .logo {

            font-size: 24px;

            font-weight: 800;

            color: #756bd1;

            letter-spacing:
                0.3px;

        }


        .logo span {
            color: #ef9ab4;
        }


        .nav-menu {

            list-style: none;

            display: flex;

            align-items: center;

            gap: 6px;

        }


        .nav-menu a {

            display: block;

            padding:
                9px 14px;

            border-radius: 12px;

            color: #666;

            font-size: 14px;

            transition:
                0.2s ease;

        }


        .nav-menu a:hover,
        .nav-menu a.active {

            background: #f0edff;

            color: #756bd1;

        }


        /* =========================
           MAIN
        ========================= */

        .main {

            max-width: 1100px;

            margin: auto;

            padding:
                45px 24px 70px;

        }


        /* =========================
           HEADER
        ========================= */

        .page-header {

            text-align: center;

            margin-bottom: 30px;

        }


        .page-badge {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding:
                7px 13px;

            margin-bottom: 15px;

            background: #fff0f5;

            color: #d98298;

            border-radius: 999px;

            font-size: 12px;

            font-weight: 700;

        }


        .page-title {

            color: #514a91;

            font-size: 38px;

            font-weight: 800;

            margin-bottom: 8px;

        }


        .page-title span {
            color: #ef9ab4;
        }


        .page-description {

            color: #999;

            font-size: 14px;

            line-height: 1.7;

        }


        /* =========================
           HSK SELECTOR
        ========================= */

        .hsk-selector {

            display: grid;

            grid-template-columns:
                repeat(6, 1fr);

            gap: 10px;

            margin-bottom: 25px;

        }


        .hsk-button {

            border:
                1px solid #eeeafa;

            background: white;

            border-radius: 16px;

            padding:
                15px 10px;

            cursor: pointer;

            color: #777;

            transition:
                0.2s ease;

        }


        .hsk-button:hover {

            transform:
                translateY(-2px);

            border-color:
                #dcd6fa;

            box-shadow:
                0 7px 18px
                rgba(70, 60, 130, 0.06);

        }


        .hsk-button.active {

            background:
                linear-gradient(
                    135deg,
                    #756bd1,
                    #958ce2
                );

            border-color:
                #756bd1;

            color: white;

            box-shadow:
                0 8px 20px
                rgba(117, 107, 209, 0.20);

        }


        .hsk-button-number {

            display: block;

            font-size: 19px;

            font-weight: 800;

        }


        .hsk-button-count {

            display: block;

            margin-top: 3px;

            font-size: 10px;

            opacity: 0.8;

        }


        /* =========================
           SEARCH
        ========================= */

        .search-box {

            max-width: 680px;

            margin:
                0 auto 25px;

            position: relative;

        }


        .search-input {

            width: 100%;

            height: 54px;

            padding:
                0 55px 0 18px;

            border:
                1px solid #e7e3f4;

            border-radius: 16px;

            background: white;

            color: #444;

            font-size: 14px;

            outline: none;

            box-shadow:
                0 7px 20px
                rgba(80, 70, 140, 0.05);

            transition:
                0.2s ease;

        }


        .search-input:focus {

            border-color:
                #c8c1f2;

            box-shadow:
                0 8px 25px
                rgba(117, 107, 209, 0.10);

        }


        .search-input::placeholder {
            color: #aaa;
        }


        .search-icon {

            position: absolute;

            right: 18px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 20px;

            color: #8b83ca;

            pointer-events: none;

        }


        /* =========================
           RESULT INFO
        ========================= */

        .result-info {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            margin-bottom: 15px;

        }


        .result-title {

            color: #514a91;

            font-size: 18px;

            font-weight: 800;

        }


        .result-count {

            color: #999;

            font-size: 12px;

        }


        /* =========================
           WORD GRID
        ========================= */

        .word-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 16px;

        }


        .word-card {

            display: block;

            background: white;

            border:
                1px solid #eeeafa;

            border-radius: 20px;

            padding: 21px;

            box-shadow:
                0 7px 20px
                rgba(70, 60, 130, 0.05);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        .word-card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 12px 28px
                rgba(70, 60, 130, 0.10);

        }


        .word-top {

            display: flex;

            align-items: flex-start;

            justify-content:
                space-between;

            gap: 10px;

        }


        .word-chinese {

            color: #514a91;

            font-size: 29px;

            font-weight: 800;

            line-height: 1.3;

        }


        .word-pinyin {

            color: #8b83ca;

            font-size: 13px;

            margin-top: 4px;

        }


        .word-pronunciation {

            color: #999;

            font-size: 11px;

            margin-top: 3px;

        }


        .word-meanings {

            color: #666;

            font-size: 13px;

            line-height: 1.6;

            margin-top: 10px;

        }


        .word-tag {

            display: inline-block;

            margin-top: 13px;

            padding:
                4px 9px;

            background: #f4f2ff;

            color: #8178c3;

            border-radius: 8px;

            font-size: 10px;

            font-weight: 700;

        }


        /* =========================
           EMPTY
        ========================= */

        .empty-box {

            background: white;

            border:
                1px solid #eeeafa;

            border-radius: 20px;

            padding:
                45px 20px;

            text-align: center;

        }


        .empty-icon {

            font-size: 40px;

            margin-bottom: 12px;

        }


        .empty-title {

            color: #514a91;

            font-size: 17px;

            font-weight: 800;

            margin-bottom: 5px;

        }


        .empty-text {

            color: #999;

            font-size: 12px;

            line-height: 1.7;

        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            text-align: center;

            padding: 40px;

            color: #999;

            font-size: 13px;

        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            padding:
                30px 20px 40px;

            text-align: center;

            color: #aaa;

            font-size: 12px;

            border-top:
                1px solid #eeeafa;

            background: white;

        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 850px) {

            .hsk-selector {

                grid-template-columns:
                    repeat(3, 1fr);

            }


            .word-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .nav-container {

                min-height: 62px;

                padding:
                    9px 16px;

            }


            .logo {
                font-size: 21px;
            }


            .nav-menu {
                gap: 2px;
            }


            .nav-menu a {

                padding:
                    8px 9px;

                font-size: 12px;

            }


            .main {

                padding:
                    30px 16px 55px;

            }


            .page-title {

                font-size: 30px;

            }


            .page-description {

                font-size: 12px;

            }


            .hsk-selector {

                grid-template-columns:
                    repeat(3, 1fr);

                gap: 8px;

            }


            .hsk-button {

                padding:
                    12px 7px;

                border-radius: 13px;

            }


            .hsk-button-number {
                font-size: 16px;
            }


            .hsk-button-count {
                font-size: 9px;
            }


            .word-grid {

                grid-template-columns: 1fr;

                gap: 12px;

            }


            .word-card {

                padding: 18px;

                border-radius: 17px;

            }


            .result-info {

                align-items: flex-start;

                gap: 10px;

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="nav-container">

            <a
                href="index.html"
                class="logo"
            >
                Mini<span>-Dicto</span>
            </a>


            <ul class="nav-menu">

                <li>

                    <a href="index.html">
                        หน้าหลัก
                    </a>

                </li>


                <li>

                    <a
                        href="hsk.html"
                        class="active"
                    >
                        HSK
                    </a>

                </li>

            </ul>

        </div>

    </nav>



    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">


        <!-- HEADER -->

        <header class="page-header">

            <div class="page-badge">
                🇨🇳 HSK Vocabulary
            </div>


            <h1 class="page-title">
                คำศัพท์ <span>HSK 1–6</span>
            </h1>


            <p class="page-description">

                เลือกระดับ HSK เพื่อดูคำศัพท์ทั้งหมด
                <br>
                ข้อมูลจะถูกโหลดจาก dictionary.json อัตโนมัติ ✨

            </p>

        </header>



        <!-- =========================
             HSK BUTTONS
        ========================== -->

        <div
            id="hskSelector"
            class="hsk-selector"
        >

            <!-- JavaScript สร้างปุ่มตรงนี้ -->

        </div>



        <!-- =========================
             SEARCH
        ========================== -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="ค้นหาคำศัพท์ เช่น 学习, xuéxí, เรียน..."
                autocomplete="off"
            >

            <div class="search-icon">
                🔍
            </div>

        </div>



        <!-- =========================
             RESULT INFO
        ========================== -->

        <div class="result-info">

            <div
                id="resultTitle"
                class="result-title"
            >
                HSK 1
            </div>


            <div
                id="resultCount"
                class="result-count"
            >
                กำลังโหลด...
            </div>

        </div>



        <!-- =========================
             WORDS
        ========================= -->

        <div
            id="wordGrid"
            class="word-grid"
        >

            <div class="loading">
                ⏳ กำลังโหลดคำศัพท์...
            </div>

        </div>


    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer class="footer">

        Mini-Dicto · Chinese–Thai Dictionary

        <br>

        เรียนภาษาจีนทีละคำ เข้าใจง่ายขึ้นทุกวัน 🌷

    </footer>



    <script>

        /* =========================
           VARIABLES
        ========================= */

        let dictionary = [];

        let selectedHSK = "1";


        const hskSelector =
            document.getElementById(
                "hskSelector"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const resultTitle =
            document.getElementById(
                "resultTitle"
            );

        const resultCount =
            document.getElementById(
                "resultCount"
            );

        const wordGrid =
            document.getElementById(
                "wordGrid"
            );


        /* =========================
           ESCAPE HTML
        ========================= */

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text ?? "";

            return div.innerHTML;

        }


        /* =========================
           NORMALIZE
        ========================= */

        function normalizeText(text) {

            return String(text || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                )
                .replace(
                    /ü/g,
                    "u"
                )
                .trim();

        }


        /* =========================
           LOAD DICTIONARY
        ========================= */

        async function loadDictionary() {

            try {

                const response =
                    await fetch(
                        "./dictionary.json"
                    );


                if (!response.ok) {

                    throw new Error(
                        "โหลด dictionary.json ไม่สำเร็จ"
                    );

                }


                dictionary =
                    await response.json();


                if (
                    !Array.isArray(
                        dictionary
                    )
                ) {

                    throw new Error(
                        "dictionary.json ต้องเป็น Array"
                    );

                }


                console.log(
                    "โหลดคำศัพท์:",
                    dictionary.length,
                    "คำ"
                );


                createHSKButtons();

                renderWords();

            }


            catch (error) {

                console.error(
                    error
                );


                wordGrid.innerHTML = `

                    <div
                        class="empty-box"
                        style="grid-column:1/-1;"
                    >

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <div class="empty-title">
                            โหลดข้อมูลไม่สำเร็จ
                        </div>

                        <div class="empty-text">

                            กรุณาตรวจสอบว่า
                            <br>
                            <b>dictionary.json</b>
                            อยู่ในโฟลเดอร์เดียวกับ
                            <b>hsk.html</b>

                        </div>

                    </div>

                `;


                resultCount.textContent =
                    "เกิดข้อผิดพลาด";

            }

        }


        /* =========================
           GET HSK COUNT
        ========================= */

        function getHSKCount(level) {

            return dictionary.filter(
                item => {

                    const hsk =
                        Array.isArray(item.hsk)
                            ? item.hsk.map(String)
                            : [
                                String(
                                    item.hsk ?? ""
                                )
                            ];

                    return hsk.includes(
                        String(level)
                    );

                }
            ).length;

        }


        /* =========================
           CREATE HSK BUTTONS
        ========================= */

        function createHSKButtons() {

            hskSelector.innerHTML = "";


            for (
                let level = 1;
                level <= 6;
                level++
            ) {

                const count =
                    getHSKCount(level);


                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "hsk-button";


                if (
                    String(level) ===
                    String(selectedHSK)
                ) {

                    button.classList.add(
                        "active"
                    );

                }


                button.innerHTML = `

                    <span
                        class="hsk-button-number"
                    >
                        HSK ${level}
                    </span>

                    <span
                        class="hsk-button-count"
                    >
                        ${count} คำ
                    </span>

                `;


                button.addEventListener(
                    "click",
                    function () {

                        selectedHSK =
                            String(level);


                        document
                            .querySelectorAll(
                                ".hsk-button"
                            )
                            .forEach(
                                btn =>
                                    btn.classList.remove(
                                        "active"
                                    )
                            );


                        this.classList.add(
                            "active"
                        );


                        searchInput.value =
                            "";


                        renderWords();

                    }
                );


                hskSelector.appendChild(
                    button
                );

            }

        }


        /* =========================
           FILTER WORDS
        ========================= */

        function getFilteredWords() {

            const search =
                normalizeText(
                    searchInput.value
                );


            return dictionary.filter(
                item => {

                    /* HSK */

                    const hsk =
                        Array.isArray(item.hsk)
                            ? item.hsk.map(String)
                            : [
                                String(
                                    item.hsk ?? ""
                                )
                            ];


                    if (
                        !hsk.includes(
                            String(
                                selectedHSK
                            )
                        )
                    ) {

                        return false;

                    }


                    /* ไม่มี search */

                    if (!search) {
                        return true;
                    }


                    /* WORD */

                    const word =
                        normalizeText(
                            item.word
                        );


                    /* PINYIN */

                    const pinyin =
                        normalizeText(
                            item.pinyin
                        );


                    /* THAI PRONUNCIATION */

                    const pronunciation =
                        normalizeText(
                            item.thaiPronunciation
                        );


                    /* MEANINGS */

                    const meanings =
                        normalizeText(
                            Array.isArray(
                                item.meanings
                            )
                                ? item.meanings.join(
                                    " "
                                )
                                : item.meanings
                        );


                    return (

                        word.includes(search) ||

                        pinyin.includes(search) ||

                        pronunciation.includes(
                            search
                        ) ||

                        meanings.includes(search)

                    );

                }
            );

        }


        /* =========================
           RENDER WORDS
        ========================= */

        function renderWords() {

            const words =
                getFilteredWords();


            resultTitle.textContent =
                `HSK ${selectedHSK}`;


            resultCount.textContent =
                `พบ ${words.length} คำ`;


            /* EMPTY */

            if (
                words.length === 0
            ) {

                wordGrid.innerHTML = `

                    <div
                        class="empty-box"
                        style="
                            grid-column: 1 / -1;
                        "
                    >

                        <div class="empty-icon">
                            🔍
                        </div>

                        <div class="empty-title">
                            ไม่พบคำศัพท์
                        </div>

                        <div class="empty-text">

                            ${
                                searchInput.value
                                    ? `ไม่พบคำว่า "${escapeHTML(
                                        searchInput.value
                                      )}"`
                                    : `ยังไม่มีคำศัพท์ใน HSK ${selectedHSK}`
                            }

                        </div>

                    </div>

                `;


                return;

            }


            /* SORT */

            words.sort(
                (a, b) =>
                    String(
                        a.word || ""
                    ).localeCompare(
                        String(
                            b.word || ""
                        )
                    )
            );


            /* CREATE CARDS */

            wordGrid.innerHTML =
                words.map(
                    item => {

                        const meanings =
                            Array.isArray(
                                item.meanings
                            )
                                ? item.meanings.join(
                                    " / "
                                )
                                : item.meanings || "";


                        return `

                            <a
                                href="word.html?id=${encodeURIComponent(
                                    item.id
                                )}"
                                class="word-card"
                            >

                                <div class="word-top">

                                    <div>

                                        <div
                                            class="word-chinese"
                                        >
                                            ${escapeHTML(
                                                item.word || ""
                                            )}
                                        </div>


                                        <div
                                            class="word-pinyin"
                                        >
                                            ${escapeHTML(
                                                item.pinyin || ""
                                            )}
                                        </div>


                                        ${
                                            item.thaiPronunciation
                                                ? `
                                                    <div
                                                        class="word-pronunciation"
                                                    >
                                                        ${escapeHTML(
                                                            item.thaiPronunciation
                                                        )}
                                                    </div>
                                                  `
                                                : ""
                                        }

                                    </div>

                                </div>


                                <div
                                    class="word-meanings"
                                >
                                    ${escapeHTML(
                                        meanings
                                    )}
                                </div>


                                <div
                                    class="word-tag"
                                >
                                    HSK ${escapeHTML(
                                        selectedHSK
                                    )}
                                </div>

                            </a>

                        `;

                    }
                ).join("");

        }


        /* =========================
           SEARCH EVENT
        ========================= */

        searchInput.addEventListener(
            "input",
            function () {

                renderWords();

            }
        );


        /* =========================
           START
        ========================= */

        loadDictionary();

    </script>


</body>

</html>
```
