<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mini-Dicto Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #f5f7fb;
      color: #333;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 40px auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #4d6fa9;
    }

    h2 {
      color: #4d6fa9;
      font-size: 20px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

    .primary {
      width: 100%;
      background: #6f91c8;
      color: white;
    }

    .primary:hover {
      background: #587bb5;
    }

    .logout {
      background: #eee;
      color: #555;
    }

    .hidden {
      display: none;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .success {
      background: #e7f7ed;
      color: #247a45;
    }

    .error {
      background: #fdeaea;
      color: #b32626;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .result {
      margin-top: 20px;
      background: #f7f9fc;
      padding: 18px;
      border-radius: 12px;
    }

    .word {
      font-size: 32px;
      font-weight: bold;
      color: #333;
    }

    .pinyin {
      color: #777;
      margin-top: 5px;
    }

    .meaning {
      margin-top: 10px;
    }

    .example {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .example:last-child {
      border-bottom: none;
    }

    .small {
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <h1>📚 Mini-Dicto</h1>
    <p style="text-align:center;">ระบบเพิ่มคำศัพท์ด้วย AI</p>
  </div>


  <!-- LOGIN -->
  <div id="loginBox" class="card">

    <h2>🔐 เข้าสู่ระบบ</h2>

    <label>Username</label>
    <input
      id="username"
      type="text"
      placeholder="กรอก Username"
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="กรอก Password"
    >

    <button
      id="loginButton"
      class="primary"
      onclick="login()"
    >
      เข้าสู่ระบบ
    </button>

  </div>


  <!-- ADMIN -->
  <div id="adminBox" class="card hidden">

    <h2>🤖 เพิ่มคำศัพท์ด้วย AI</h2>

    <p>
      พิมพ์เฉพาะคำภาษาจีน แล้วให้ AI สร้างข้อมูลให้
    </p>

    <label>คำศัพท์ภาษาจีน</label>

    <input
      id="wordInput"
      type="text"
      placeholder="เช่น 爱"
      autocomplete="off"
    >

    <button
      id="addButton"
      class="primary"
      onclick="addWord()"
    >
      ✨ สร้างข้อมูลและบันทึก
    </button>

    <div id="message"></div>

    <div id="result" class="result hidden"></div>

    <button
      class="logout"
      onclick="logout()"
    >
      ออกจากระบบ
    </button>

  </div>

</div>


<script>

  const API_URL =
    "https://mini-dicto-api.namelovetang.workers.dev";


  // =========================
  // MESSAGE
  // =========================

  function showMessage(text, type) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className = type;

    message.style.display = "block";
  }


  function hideMessage() {

    const message =
      document.getElementById("message");

    message.style.display = "none";
  }


  // =========================
  // LOGIN
  // =========================

  async function login() {

    const username =
      document.getElementById("username").value.trim();

    const password =
      document.getElementById("password").value;


    if (!username || !password) {

      showMessage(
        "กรุณากรอก Username และ Password",
        "error"
      );

      return;
    }


    const button =
      document.getElementById("loginButton");

    button.classList.add("loading");

    button.textContent = "กำลังเข้าสู่ระบบ...";


    try {

      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            action: "login",

            username: username,

            password: password

          })

        });


      const data =
        await response.json();


      if (!response.ok || !data.success) {

        throw new Error(
          data.message || "เข้าสู่ระบบไม่สำเร็จ"
        );

      }


      sessionStorage.setItem(
        "mini_dicto_token",
        data.token
      );


      document
        .getElementById("loginBox")
        .classList.add("hidden");


      document
        .getElementById("adminBox")
        .classList.remove("hidden");


      hideMessage();


    } catch (error) {

      showMessage(
        error.message,
        "error"
      );

    } finally {

      button.classList.remove("loading");

      button.textContent =
        "เข้าสู่ระบบ";

    }

  }


  // =========================
  // ADD WORD WITH AI
  // =========================

  async function addWord() {

    const input =
      document.getElementById("wordInput");

    const word =
      input.value.trim();


    if (!word) {

      showMessage(
        "กรุณาพิมพ์คำศัพท์ภาษาจีน",
        "error"
      );

      input.focus();

      return;
    }


    const token =
      sessionStorage.getItem(
        "mini_dicto_token"
      );


    if (!token) {

      showMessage(
        "กรุณาเข้าสู่ระบบก่อน",
        "error"
      );

      return;
    }


    const button =
      document.getElementById("addButton");


    button.classList.add("loading");

    button.textContent =
      "🤖 AI กำลังสร้างข้อมูล...";


    hideMessage();


    try {

      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + token

          },

          body: JSON.stringify({

            action: "ai_add",

            word: word

          })

        });


      const data =
        await response.json();


      if (!response.ok || !data.success) {

        throw new Error(
          data.message ||
          "ไม่สามารถเพิ่มคำศัพท์ได้"
        );

      }


      showMessage(
        "✅ " + data.message,
        "success"
      );


      displayResult(data.word);


      input.value = "";

      input.focus();


    } catch (error) {

      showMessage(
        "❌ " + error.message,
        "error"
      );

    } finally {

      button.classList.remove("loading");

      button.textContent =
        "✨ สร้างข้อมูลและบันทึก";

    }

  }


  // =========================
  // DISPLAY RESULT
  // =========================

  function displayResult(word) {

    const result =
      document.getElementById("result");


    if (!word) {

      result.classList.add("hidden");

      return;

    }


    const meanings =
      Array.isArray(word.meanings)
        ? word.meanings.join(", ")
        : "";


    const partOfSpeech =
      Array.isArray(word.partOfSpeech)
        ? word.partOfSpeech.join(", ")
        : "";


    const hsk =
      Array.isArray(word.hsk)
        ? word.hsk.join(", ")
        : "";


    let examplesHTML = "";


    if (Array.isArray(word.examples)) {

      examplesHTML =
        word.examples.map(example => {

          const chinese =
            example.chinese ||
            example.zh ||
            "";

          const pinyin =
            example.pinyin ||
            "";

          const thai =
            example.thai ||
            example.th ||
            "";


          return `
            <div class="example">

              <div>
                🇨🇳 ${escapeHTML(chinese)}
              </div>

              <div class="pinyin">
                ${escapeHTML(pinyin)}
              </div>

              <div>
                🇹🇭 ${escapeHTML(thai)}
              </div>

            </div>
          `;

        }).join("");

    }


    result.innerHTML = `

      <div class="word">
        ${escapeHTML(word.word || "")}
      </div>

      <div class="pinyin">
        ${escapeHTML(word.pinyin || "")}
      </div>

      <div class="meaning">
        <b>คำแปล:</b>
        ${escapeHTML(meanings)}
      </div>

      <div class="meaning">
        <b>ชนิดคำ:</b>
        ${escapeHTML(partOfSpeech)}
      </div>

      <div class="meaning">
        <b>HSK:</b>
        ${escapeHTML(hsk)}
      </div>

      <hr>

      <b>ตัวอย่างประโยค</b>

      ${examplesHTML}

      <div class="small">
        ID: ${escapeHTML(String(word.id || ""))}
      </div>

    `;


    result.classList.remove("hidden");

  }


  // =========================
  // ESCAPE HTML
  // =========================

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // =========================
  // LOGOUT
  // =========================

  function logout() {

    sessionStorage.removeItem(
      "mini_dicto_token"
    );


    document
      .getElementById("adminBox")
      .classList.add("hidden");


    document
      .getElementById("loginBox")
      .classList.remove("hidden");


    document.getElementById(
      "username"
    ).value = "";


    document.getElementById(
      "password"
    ).value = "";


    document.getElementById(
      "wordInput"
    ).value = "";


    document.getElementById(
      "result"
    ).classList.add("hidden");


    hideMessage();

  }


  // =========================
  // ENTER KEY
  // =========================

  document
    .getElementById("wordInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          addWord();

        }

      }
    );

</script>

</body>
</html>
