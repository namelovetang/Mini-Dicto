<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini-Dicto | คำศัพท์</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                "Noto Sans Thai",
                "Noto Sans",
                Arial,
                sans-serif;
            background: linear-gradient(
                135deg,
                #eef8ff,
                #fff4fa
            );
            color: #344054;
            min-height: 100vh;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e7edf5;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-inner {
            max-width: 1100px;
            margin: auto;
            padding: 14px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            text-decoration: none;
            color: #4d8fc7;
            font-size: 21px;
            font-weight: 800;
        }

        .logo span {
            color: #e88db5;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-links a {
            text-decoration: none;
            color: #667085;
            padding: 8px 13px;
            border-radius: 10px;
            font-size: 14px;
        }

        .nav-links a:hover {
            background: #eef7ff;
            color: #4d8fc7;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: min(920px, calc(100% - 30px));
            margin: 35px auto 60px;
        }

        /* =========================
           BACK
        ========================= */

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            border: none;
            background: transparent;
            color: #6b8eac;

            font-size: 15px;
            cursor: pointer;

            margin-bottom: 18px;
        }

        .back-btn:hover {
            color: #3f78a8;
        }

        /* =========================
           MAIN WORD CARD
        ========================= */

        .word-card {
            background: rgba(255,255,255,0.96);
            border: 1px solid #e5edf5;
            border-radius: 26px;
            padding: 35px 30px;

            box-shadow:
                0 15px 45px rgba(65, 105, 140, 0.10);

            text-align: center;
        }

        .word {
            font-size: clamp(48px, 10vw, 78px);
            font-weight: 800;
            color: #3f79a8;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        .pinyin {
            font-size: 25px;
            color: #6b7280;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .thai-pronunciation {
            color: #e38aad;
            font-size: 17px;
            margin-bottom: 20px;
        }

        /* =========================
           HSK
        ========================= */

        .hsk-list {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 25px;
        }

        .hsk-badge {
            background: #e9f5ff;
            color: #3980b9;
            border: 1px solid #cde8fb;

            padding: 6px 13px;
            border-radius: 999px;

            font-size: 13px;
            font-weight: 700;
        }

        /* =========================
           INFO GRID
        ========================= */

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;

            margin-top: 10px;
        }

        .info-box {
            background: #f8fbfd;
            border: 1px solid #edf2f6;
            border-radius: 17px;
            padding: 17px;
            text-align: left;
        }

        .info-label {
            font-size: 13px;
            color: #98a2b3;
            margin-bottom: 7px;
        }

        .info-value {
            color: #344054;
            font-size: 16px;
            font-weight: 600;
        }

        /* =========================
           SECTION
        ========================= */

        .section {
            margin-top: 22px;

            background: rgba(255,255,255,0.96);
            border: 1px solid #e5edf5;
            border-radius: 22px;

            padding: 25px;

            box-shadow:
                0 10px 30px rgba(65, 105, 140, 0.06);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 19px;
            font-weight: 800;

            color: #3f79a8;

            margin-bottom: 18px;
        }

        /* =========================
           MEANINGS
        ========================= */

        .meaning-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .meaning-item {
            background: #fff7fb;
            border-left: 4px solid #e89abb;

            padding: 12px 15px;
            border-radius: 10px;

            font-size: 16px;
            color: #475467;
        }

        /* =========================
           PART OF SPEECH
        ========================= */

        .pos-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pos {
            background: #eef8ff;
            color: #4a83ad;

            border-radius: 10px;
            padding: 8px 12px;

            font-size: 14px;
            font-weight: 600;
        }

        /* =========================
           EXAMPLES
        ========================= */

        .example {
            border: 1px solid #edf1f5;
            background: #fbfcfe;

            border-radius: 16px;

            padding: 17px;
            margin-bottom: 12px;
        }

        .example:last-child {
            margin-bottom: 0;
        }

        .example-chinese {
            font-size: 20px;
            font-weight: 700;
            color: #344054;

            line-height: 1.7;
        }

        .example-pinyin {
            font-size: 15px;
            color: #6b7280;

            margin-top: 4px;
        }

        .example-thai {
            font-size: 15px;
            color: #e083aa;

            margin-top: 5px;
        }

        /* =========================
           RELATED WORDS
        ========================= */

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 11px;
        }

        .related-word {
            text-decoration: none;

            background: #f8fbff;
            border: 1px solid #e3edf5;

            border-radius: 14px;

            padding: 13px;

            transition: 0.2s;
        }

        .related-word:hover {
            transform: translateY(-2px);
            border-color: #b8d8ef;
            box-shadow: 0 6px 18px rgba(65,105,140,0.08);
        }

        .related-chinese {
            font-size: 21px;
            font-weight: 700;
            color: #477fa8;
        }

        .related-pinyin {
            font-size: 13px;
            color: #8b95a1;
            margin-top: 2px;
        }

        .related-thai {
            font-size: 13px;
            color: #df89ab;
            margin-top: 2px;
        }

        /* =========================
           ERROR / LOADING
        ========================= */

        .state-box {
            background: white;
            border: 1px solid #e5edf5;
            border-radius: 22px;

            padding: 45px 25px;
            text-align: center;

            box-shadow: 0 10px 30px rgba(65,105,140,0.07);
        }

        .state-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .state-title {
            font-size: 20px;
            font-weight: 800;
            color: #475467;
            margin-bottom: 8px;
        }

        .state-text {
            color: #98a2b3;
            line-height: 1.7;
        }

        .home-btn {
            display: inline-block;
            margin-top: 18px;

            background: #6fa7d0;
            color: white;

            text-decoration: none;

            padding: 10px 18px;
            border-radius: 12px;

            font-weight: 700;
            font-size: 14px;
        }

        .home-btn:hover {
            background: #5d96c1;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .nav-inner {
                padding: 12px 15px;
            }

            .logo {
                font-size: 18px;
            }

            .nav-links a {
                padding: 7px 9px;
                font-size: 13px;
            }

            .container {
                width: min(100% - 20px, 920px);
                margin-top: 20px;
            }

            .word-card {
                padding: 28px 18px;
                border-radius: 21px;
            }

            .word {
                font-size: 55px;
            }

            .pinyin {
                font-size: 22px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .section {
                padding: 19px;
                border-radius: 18px;
            }

            .section-title {
                font-size: 17px;
            }

            .example-chinese {
                font-size: 18px;
            }

            .related-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="nav-inner">

        <a href="index.html" class="logo">
            Mini-<span>Dicto</span>
        </a>

        <div class="nav-links">
            <a href="index.html">🔎 ค้นหา</a>
            <a href="hsk.html">📚 HSK</a>
        </div>

    </div>
</nav>


<main class="container">

    <button class="back-btn" onclick="history.back()">
        ← ย้อนกลับ
    </button>

    <div id="content">

        <div class="state-box">
            <div class="state-icon">📖</div>
            <div class="state-title">กำลังโหลดคำศัพท์...</div>
            <div class="state-text">
                กรุณารอสักครู่
            </div>
        </div>

    </div>

</main>


<script>

const params = new URLSearchParams(window.location.search);
const wordId = params.get("id");

let dictionary = [];


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   ARRAY HELPER
========================= */

function toArray(value) {

    if (Array.isArray(value)) {
        return value;
    }

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {
        return [];
    }

    return [value];
}


/* =========================
   LOAD DICTIONARY
========================= */

async function loadDictionary() {

    const content = document.getElementById("content");

    try {

        if (!wordId) {

            showError(
                "ไม่พบรหัสคำศัพท์",
                "URL นี้ไม่มี id ของคำศัพท์"
            );

            return;
        }


        const response = await fetch(
            "./dictionary.json?version=" + Date.now()
        );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status} - ${response.statusText}`
            );

        }


        const text = await response.text();


        if (!text.trim()) {

            throw new Error(
                "dictionary.json เป็นไฟล์ว่าง"
            );

        }


        try {

            dictionary = JSON.parse(text);

        } catch (error) {

            throw new Error(
                "รูปแบบ dictionary.json ไม่ถูกต้อง"
            );

        }


        if (!Array.isArray(dictionary)) {

            throw new Error(
                "dictionary.json ต้องเป็น Array []"
            );

        }


        const word = dictionary.find(
            item =>
                String(item.id) === String(wordId)
        );


        if (!word) {

            showError(
                "ไม่พบคำศัพท์",
                `ไม่พบคำศัพท์ที่มี ID: ${wordId}`
            );

            return;
        }


        renderWord(word);


    } catch (error) {

        console.error(error);

        showError(
            "โหลดข้อมูลไม่สำเร็จ",
            error.message
        );

    }
}


/* =========================
   RENDER WORD
========================= */

function renderWord(word) {

    const meanings = toArray(word.meanings);
    const pos = toArray(word.partOfSpeech);
    const hsk = toArray(word.hsk);

    const examples = toArray(word.examples);


    /* =========================
       EXAMPLES
    ========================= */

    let examplesHTML = "";

    if (examples.length > 0) {

        examplesHTML = examples.map(example => {

            const chinese =
                example.chinese ??
                example.sentence ??
                "";

            const pinyin =
                example.pinyin ??
                "";

            const thai =
                example.thai ??
                example.translation ??
                "";

            return `
                <div class="example">

                    ${
                        chinese
                        ? `
                            <div class="example-chinese">
                                ${escapeHTML(chinese)}
                            </div>
                        `
                        : ""
                    }

                    ${
                        pinyin
                        ? `
                            <div class="example-pinyin">
                                ${escapeHTML(pinyin)}
                            </div>
                        `
                        : ""
                    }

                    ${
                        thai
                        ? `
                            <div class="example-thai">
                                ${escapeHTML(thai)}
                            </div>
                        `
                        : ""
                    }

                </div>
            `;

        }).join("");

    } else {

        examplesHTML = `
            <div class="state-text">
                ยังไม่มีตัวอย่างประโยค
            </div>
        `;

    }


    /* =========================
       RELATED WORDS
    ========================= */

    const relatedWords =
        getRelatedWords(word);


    let relatedHTML = "";

    if (relatedWords.length > 0) {

        relatedHTML = relatedWords.map(item => {

            return `
                <a
                    class="related-word"
                    href="word.html?id=${encodeURIComponent(item.id)}"
                >

                    <div class="related-chinese">
                        ${escapeHTML(item.word)}
                    </div>

                    ${
                        item.pinyin
                        ? `
                            <div class="related-pinyin">
                                ${escapeHTML(item.pinyin)}
                            </div>
                        `
                        : ""
                    }

                    ${
                        item.thaiPronunciation
                        ? `
                            <div class="related-thai">
                                ${escapeHTML(item.thaiPronunciation)}
                            </div>
                        `
                        : ""
                    }

                </a>
            `;

        }).join("");

    } else {

        relatedHTML = `
            <div class="state-text">
                ยังไม่มีคำที่เกี่ยวข้อง
            </div>
        `;

    }


    /* =========================
       MAIN HTML
    ========================= */

    document.title =
        `${word.word} | Mini-Dicto`;


    document.getElementById("content").innerHTML = `

        <!-- WORD HEADER -->

        <section class="word-card">

            <div class="word">
                ${escapeHTML(word.word)}
            </div>

            ${
                word.pinyin
                ? `
                    <div class="pinyin">
                        ${escapeHTML(word.pinyin)}
                    </div>
                `
                : ""
            }

            ${
                word.thaiPronunciation
                ? `
                    <div class="thai-pronunciation">
                        คำอ่านไทย: ${escapeHTML(word.thaiPronunciation)}
                    </div>
                `
                : ""
            }


            ${
                hsk.length
                ? `
                    <div class="hsk-list">

                        ${hsk.map(level => `
                            <span class="hsk-badge">
                                HSK ${escapeHTML(level)}
                            </span>
                        `).join("")}

                    </div>
                `
                : ""
            }


            <div class="info-grid">

                <div class="info-box">

                    <div class="info-label">
                        🔤 Pinyin
                    </div>

                    <div class="info-value">
                        ${escapeHTML(word.pinyin || "-")}
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        🗣️ คำอ่านไทย
                    </div>

                    <div class="info-value">
                        ${escapeHTML(
                            word.thaiPronunciation || "-"
                        )}
                    </div>

                </div>

            </div>

        </section>


        <!-- MEANINGS -->

        <section class="section">

            <div class="section-title">
                💗 ความหมาย
            </div>

            <div class="meaning-list">

                ${
                    meanings.length

                    ? meanings.map(meaning => `
                        <div class="meaning-item">
                            ${escapeHTML(meaning)}
                        </div>
                    `).join("")

                    : `
                        <div class="state-text">
                            ยังไม่มีข้อมูลความหมาย
                        </div>
                    `
                }

            </div>

        </section>


        <!-- PART OF SPEECH -->

        <section class="section">

            <div class="section-title">
                📝 ชนิดคำ
            </div>

            <div class="pos-list">

                ${
                    pos.length

                    ? pos.map(item => `
                        <span class="pos">
                            ${escapeHTML(item)}
                        </span>
                    `).join("")

                    : `
                        <div class="state-text">
                            ยังไม่มีข้อมูลชนิดคำ
                        </div>
                    `
                }

            </div>

        </section>


        <!-- EXAMPLES -->

        <section class="section">

            <div class="section-title">
                💬 ตัวอย่างประโยค
            </div>

            ${examplesHTML}

        </section>


        <!-- RELATED -->

        <section class="section">

            <div class="section-title">
                🔗 คำที่เกี่ยวข้อง
            </div>

            <div class="related-grid">

                ${relatedHTML}

            </div>

        </section>

    `;
}


/* =========================
   RELATED WORDS
========================= */

function getRelatedWords(currentWord) {

    const result = [];


    const currentMeanings =
        toArray(currentWord.meanings)
            .map(x => String(x).toLowerCase());


    const currentHSK =
        toArray(currentWord.hsk)
            .map(x => String(x));


    dictionary.forEach(item => {

        if (
            String(item.id) ===
            String(currentWord.id)
        ) {
            return;
        }


        let score = 0;


        /* Same HSK */

        const itemHSK =
            toArray(item.hsk)
                .map(x => String(x));


        const sameHSK =
            currentHSK.some(
                level => itemHSK.includes(level)
            );


        if (sameHSK) {
            score += 2;
        }


        /* Same meaning */

        const itemMeanings =
            toArray(item.meanings)
                .map(x => String(x).toLowerCase());


        const sameMeaning =
            currentMeanings.some(
                meaning =>
                    itemMeanings.some(
                        itemMeaning =>
                            itemMeaning.includes(meaning) ||
                            meaning.includes(itemMeaning)
                    )
            );


        if (sameMeaning) {
            score += 3;
        }


        if (score > 0) {

            result.push({
                item,
                score
            });

        }

    });


    result.sort(
        (a, b) =>
            b.score - a.score
    );


    return result
        .slice(0, 8)
        .map(x => x.item);
}


/* =========================
   ERROR
========================= */

function showError(title, text) {

    document.getElementById("content").innerHTML = `

        <div class="state-box">

            <div class="state-icon">
                ⚠️
            </div>

            <div class="state-title">
                ${escapeHTML(title)}
            </div>

            <div class="state-text">
                ${escapeHTML(text)}
            </div>

            <a
                href="index.html"
                class="home-btn"
            >
                กลับหน้าหลัก
            </a>

        </div>

    `;
}


/* =========================
   START
========================= */

loadDictionary();

</script>

</body>
</html>
